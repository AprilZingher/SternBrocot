name: Core is ℝ-free

# Deliberately does not build Lean. The whole point of the Core/ split is that
# ℝ-freeness became a property of the import graph, so checking it costs a grep
# rather than a Mathlib build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-core-closed.sh

  # NOTE: deliberately NOT run here. scripts/check-deps.sh needs a built
  # SternBrocot, which needs Mathlib's olean cache (~7.7 GB). Running it in CI
  # means paying that on every push. Run it locally after `lake build`:
  #
  #     ./scripts/check-deps.sh
  #
  # Adding it here is worth doing if this repo ever gets a cached Lean CI job.
